plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.seleniumhq.selenium:selenium-java:4.41.0")
    implementation("org.testng:testng:7.12.0")
    //нижняя библиотека, чтобы тест постоянно обновлялся - это уже Selenium4
    implementation("io.github.bonigarcia:webdrivermanager:6.3.3")
}

test {
    useTestNG()
}